              25% instead leaves 14.2% missing while adding 7.3% over-thickening, and
              restores every stroke as continuous. Lower cuts recover little further and
              thicken the hairlines more.
  Caution:    640x37 is the largest master the site publishes (the @2x and checkout
              variants are the same file or smaller), so hairline WEIGHT is approximate
